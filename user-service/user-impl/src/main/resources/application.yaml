server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crypto-user-service
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:/db/databasechangelog-master.yaml

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 2592000000